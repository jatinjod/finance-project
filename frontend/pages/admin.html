<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Panel — FinanceAI</title>


<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>

</head>


<body>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<div
    id="sidebar"
    class="sidebar"
></div>


<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<div class="main-content">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">

        <span class="topbar-title">
            Admin Panel
        </span>


        <div class="topbar-right">

            <span class="badge bg-danger px-3 py-2">

                <i
                    class="bi bi-shield-check me-1"
                ></i>

                Administrator

            </span>

        </div>

    </div>


    <!-- =====================================================
         PAGE BODY
    ====================================================== -->

    <div class="page-body">


        <!-- =================================================
             SYSTEM STATS
        ================================================== -->

        <div class="row g-3 mb-4">


            <!-- TOTAL USERS -->

            <div class="col-6 col-md-3">

                <div class="summary-card">

                    <div class="summary-icon balance">

                        <i class="bi bi-people"></i>

                    </div>


                    <div>

                        <div class="summary-label">
                            Total Users
                        </div>

                        <div
                            class="summary-value"
                            id="statTotal"
                        >
                            —
                        </div>

                    </div>

                </div>

            </div>


            <!-- ACTIVE USERS -->

            <div class="col-6 col-md-3">

                <div class="summary-card">

                    <div class="summary-icon income">

                        <i class="bi bi-person-check"></i>

                    </div>


                    <div>

                        <div class="summary-label">
                            Active Users
                        </div>

                        <div
                            class="summary-value"
                            id="statActive"
                        >
                            —
                        </div>

                    </div>

                </div>

            </div>


            <!-- INACTIVE USERS -->

            <div class="col-6 col-md-3">

                <div class="summary-card">

                    <div class="summary-icon expense">

                        <i class="bi bi-person-dash"></i>

                    </div>


                    <div>

                        <div class="summary-label">
                            Inactive Users
                        </div>

                        <div
                            class="summary-value"
                            id="statInactive"
                        >
                            —
                        </div>

                    </div>

                </div>

            </div>


            <!-- TOTAL TRANSACTIONS -->

            <div class="col-6 col-md-3">

                <div class="summary-card">

                    <div class="summary-icon neutral">

                        <i class="bi bi-activity"></i>

                    </div>


                    <div>

                        <div class="summary-label">
                            Total Transactions
                        </div>

                        <div
                            class="summary-value"
                            id="statTx"
                        >
                            —
                        </div>

                    </div>

                </div>

            </div>


        </div>


        <!-- =================================================
             REGISTERED USERS
        ================================================== -->

        <div class="card">


            <!-- HEADER -->

            <div
                class="card-header d-flex justify-content-between align-items-center"
            >

                <span>
                    Registered Users
                </span>


                <div class="d-flex gap-2">


                    <input
                        type="text"
                        id="searchInput"
                        class="form-control form-control-sm"
                        placeholder="Search name or email..."
                        style="width:220px"
                        oninput="debounceSearch()"
                    >


                    <button
                        class="btn btn-sm btn-outline-primary"
                        onclick="loadUsers()"
                        title="Refresh users"
                    >

                        <i
                            class="bi bi-arrow-clockwise"
                        ></i>

                    </button>


                </div>

            </div>


            <!-- USERS -->

            <div id="usersTable">

                <div class="text-center py-4">

                    <div
                        class="spinner-border text-primary"
                    ></div>

                </div>

            </div>


            <!-- =================================================
                 PAGINATION
            ================================================== -->

            <div
                class="card-footer bg-white d-flex justify-content-between align-items-center"
                id="paginationBar"
                style="display:none!important"
            >

                <small
                    class="text-muted"
                    id="pageInfo"
                >
                    —
                </small>


                <div class="d-flex gap-2">


                    <button
                        class="btn btn-sm btn-outline-secondary"
                        id="prevBtn"
                        onclick="changePage(-1)"
                    >

                        <i
                            class="bi bi-chevron-left"
                        ></i>

                    </button>


                    <button
                        class="btn btn-sm btn-outline-secondary"
                        id="nextBtn"
                        onclick="changePage(1)"
                    >

                        <i
                            class="bi bi-chevron-right"
                        ></i>

                    </button>


                </div>

            </div>


        </div>


    </div>

</div>


<!-- =========================================================
     USER DETAIL MODAL
========================================================= -->

<div
    class="modal fade"
    id="userModal"
    tabindex="-1"
>

    <div
        class="modal-dialog modal-dialog-centered"
    >

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    User Details
                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div
                class="modal-body"
                id="userModalBody"
            >

                <div class="text-center py-3">

                    <div
                        class="spinner-border text-primary spinner-border-sm"
                    ></div>

                </div>

            </div>


            <div
                class="modal-footer"
                id="userModalFooter"
            ></div>


        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    class="position-fixed bottom-0 end-0 p-3"
    style="z-index:9999"
>

    <div
        id="toast"
        class="toast align-items-center text-white border-0"
    >

        <div class="d-flex">


            <div class="toast-body"></div>


            <button
                type="button"
                class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast"
            ></button>


        </div>

    </div>

</div>


<!-- =========================================================
     SCRIPTS
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>

<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/sidebar.js"></script>


<script>

/* ============================================================
   STATE
============================================================ */

let currentPage = 1;

let totalPages = 1;

let searchTimer = null;


/* ============================================================
   DOM READY
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        try {

            if (!requireAdmin()) {
                return;
            }


            renderSidebar("admin");


            await Promise.all([
                loadStats(),
                loadUsers(1)
            ]);


        } catch (error) {

            console.error(
                "Admin page initialization failed:",
                error
            );

            showToast(
                "Failed to initialize admin panel.",
                "danger"
            );

        }

    }
);


/* ============================================================
   SAFE HTML
============================================================ */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ============================================================
   SAFE NUMBER
============================================================ */

function safeNumber(
    value,
    fallback = 0
) {

    const number = Number(
        value
    );

    return Number.isFinite(
        number
    )
        ? number
        : fallback;

}


/* ============================================================
   LOAD SYSTEM STATS
============================================================ */

async function loadStats() {

    try {

        const res = await API.get(
            "/api/admin/stats"
        );


        if (!res || res.error) {

            document.getElementById(
                "statTotal"
            ).textContent = "—";

            document.getElementById(
                "statActive"
            ).textContent = "—";

            document.getElementById(
                "statInactive"
            ).textContent = "—";

            document.getElementById(
                "statTx"
            ).textContent = "—";

            return;
        }


        const d = res.data || {};


        document.getElementById(
            "statTotal"
        ).textContent = safeNumber(
            d.total_users
        );


        document.getElementById(
            "statActive"
        ).textContent = safeNumber(
            d.active_users
        );


        document.getElementById(
            "statInactive"
        ).textContent = safeNumber(
            d.inactive_users
        );


        document.getElementById(
            "statTx"
        ).textContent = safeNumber(
            d.total_transactions
        ).toLocaleString(
            "en-IN"
        );


    } catch (error) {

        console.error(
            "loadStats failed:",
            error
        );

    }

}


/* ============================================================
   LOAD USERS
============================================================ */

async function loadUsers(
    page = currentPage
) {

    currentPage = page;


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const q = searchInput
        ? searchInput.value.trim()
        : "";


    let url =
        `/api/admin/users?page=${page}&per_page=10`;


    if (q) {

        url +=
            `&q=${encodeURIComponent(q)}`;

    }


    const table =
        document.getElementById(
            "usersTable"
        );


    table.innerHTML = `
        <div class="text-center py-4">
            <div class="spinner-border text-primary"></div>
        </div>
    `;


    try {

        const res =
            await API.get(url);


        if (!res || res.error) {

            table.innerHTML = `
                <div class="p-4 text-danger text-center">
                    ${escapeHtml(
                        res?.error ||
                        "Failed to load users"
                    )}
                </div>
            `;

            return;
        }


        const users =
            Array.isArray(
                res.data
            )
                ? res.data
                : [];


        const pagination =
            res.pagination || {};


        totalPages =
            safeNumber(
                pagination.pages,
                1
            );


        if (!users.length) {

            table.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-people"></i>

                    <p>
                        No users found
                        ${
                            q
                                ? ` matching "${escapeHtml(q)}"`
                                : ""
                        }.
                    </p>

                </div>
            `;


            document.getElementById(
                "paginationBar"
            ).style.display = "none";


            return;
        }


        table.innerHTML = `

            <div class="table-responsive">

                <table class="table mb-0">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Status</th>

                            <th>Joined</th>

                            <th class="text-end">
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            users.map(
                                user =>
                                renderUserRow(
                                    user
                                )
                            ).join("")
                        }

                    </tbody>

                </table>

            </div>
        `;


        const bar =
            document.getElementById(
                "paginationBar"
            );


        bar.style.display = "flex";


        document.getElementById(
            "pageInfo"
        ).textContent =
            `Page ${currentPage} of ${totalPages} · ${
                safeNumber(
                    pagination.total
                )
            } users`;


        document.getElementById(
            "prevBtn"
        ).disabled =
            currentPage <= 1;


        document.getElementById(
            "nextBtn"
        ).disabled =
            currentPage >= totalPages;


    } catch (error) {

        console.error(
            "loadUsers failed:",
            error
        );


        table.innerHTML = `
            <div class="p-4 text-danger text-center">
                Unable to load users.
            </div>
        `;

    }

}


/* ============================================================
   RENDER USER ROW
============================================================ */

function renderUserRow(
    user
) {

    const id =
        safeNumber(
            user.id
        );


    const name =
        escapeHtml(
            user.name ||
            "Unknown"
        );


    const email =
        escapeHtml(
            user.email ||
            ""
        );


    const active =
        Boolean(
            user.is_active
        );


    const joined =
        formatDate(
            user.created_at
        );


    return `

        <tr>

            <td class="text-muted small">
                #${id}
            </td>


            <td>

                <div
                    class="d-flex align-items-center gap-2"
                >

                    <div
                        class="user-avatar"
                        style="width:28px;height:28px;font-size:.7rem"
                    >
                        ${getUserInitials(
                            user.name || "U"
                        )}
                    </div>


                    <span class="fw-600">
                        ${name}
                    </span>

                </div>

            </td>


            <td class="text-muted small">
                ${email}
            </td>


            <td>

                <span
                    class="type-badge ${
                        active
                            ? "badge-income"
                            : "badge-expense"
                    }"
                >
                    ${
                        active
                            ? "Active"
                            : "Inactive"
                    }
                </span>

            </td>


            <td class="text-muted small">
                ${joined}
            </td>


            <td class="text-end">


                <button
                    class="btn btn-sm btn-outline-primary border-0 p-1 me-1"
                    onclick="viewUser(${id})"
                    title="View Details"
                >

                    <i class="bi bi-eye"></i>

                </button>


                <button
                    class="btn btn-sm btn-outline-warning border-0 p-1 me-1"
                    onclick="toggleUser(
                        ${id},
                        '${escapeJs(user.name || "")}',
                        ${active}
                    )"
                    title="${
                        active
                            ? "Deactivate"
                            : "Activate"
                    }"
                >

                    <i
                        class="bi bi-${
                            active
                                ? "pause"
                                : "play"
                        }-circle"
                    ></i>

                </button>


                <button
                    class="btn btn-sm btn-outline-danger border-0 p-1"
                    onclick="deleteUser(
                        ${id},
                        '${escapeJs(user.name || "")}'
                    )"
                    title="Delete User"
                >

                    <i class="bi bi-trash"></i>

                </button>


            </td>

        </tr>

    `;

}


/* ============================================================
   ESCAPE JS STRING
============================================================ */

function escapeJs(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r/g,
        ""
    )
    .replace(
        /\n/g,
        "\\n"
    );

}


/* ============================================================
   VIEW USER DETAILS
============================================================ */

async function viewUser(
    id
) {

    const body =
        document.getElementById(
            "userModalBody"
        );


    const footer =
        document.getElementById(
            "userModalFooter"
        );


    body.innerHTML = `

        <div class="text-center py-4">

            <div
                class="spinner-border text-primary spinner-border-sm"
            ></div>

            <div class="text-muted small mt-2">
                Loading user details...
            </div>

        </div>
    `;


    footer.innerHTML = "";


    const modal =
        bootstrap.Modal.getOrCreateInstance(
            document.getElementById(
                "userModal"
            )
        );


    modal.show();


    try {

        const res =
            await API.get(
                `/api/admin/users/${id}`
            );


        if (!res || res.error || !res.data) {

            body.innerHTML = `

                <div class="text-danger text-center py-4">

                    ${
                        escapeHtml(
                            res?.error ||
                            "Failed to load user details."
                        )
                    }

                </div>

            `;

            return;
        }


        const u = res.data;


        // ----------------------------------------------------
        // IMPORTANT:
        // Backend now returns:
        //
        // u.stats.income_records
        // u.stats.expense_records
        // u.stats.total_records
        //
        // Fallbacks keep this frontend compatible with
        // older backend responses.
        // ----------------------------------------------------

        const stats =
            u.stats || {};


        const incomeRecords =
            safeNumber(
                stats.income_records ??
                u.income_count ??
                0
            );


        const expenseRecords =
            safeNumber(
                stats.expense_records ??
                u.expense_count ??
                0
            );


        const totalRecords =
            safeNumber(
                stats.total_records ??
                u.transaction_count ??
                (
                    incomeRecords +
                    expenseRecords
                )
            );


        const userName =
            escapeHtml(
                u.name ||
                "Unknown User"
            );


        const userEmail =
            escapeHtml(
                u.email ||
                ""
            );


        const role =
            escapeHtml(
                u.role ||
                "user"
            );


        const active =
            Boolean(
                u.is_active
            );


        body.innerHTML = `

            <div class="text-center mb-4">

                <div
                    class="user-avatar mx-auto mb-2"
                    style="width:56px;height:56px;font-size:1.3rem"
                >
                    ${getUserInitials(
                        u.name || "U"
                    )}
                </div>


                <h6 class="mb-0">
                    ${userName}
                </h6>


                <small class="text-muted">
                    ${userEmail}
                </small>

            </div>


            <!-- RECORD COUNTS -->

            <div class="row g-3">


                <!-- INCOME -->

                <div class="col-6">

                    <div
                        class="bg-light rounded p-3 text-center"
                    >

                        <div
                            class="fs-4 fw-700 text-primary"
                        >
                            ${incomeRecords}
                        </div>


                        <div class="text-muted small">
                            Income Records
                        </div>

                    </div>

                </div>


                <!-- EXPENSE -->

                <div class="col-6">

                    <div
                        class="bg-light rounded p-3 text-center"
                    >

                        <div
                            class="fs-4 fw-700 text-danger"
                        >
                            ${expenseRecords}
                        </div>


                        <div class="text-muted small">
                            Expense Records
                        </div>

                    </div>

                </div>


            </div>


            <!-- USER INFORMATION -->

            <div class="mt-3">

                <table class="table table-sm">


                    <tr>

                        <td class="text-muted">
                            Role
                        </td>

                        <td>

                            <span class="badge bg-primary">
                                ${role}
                            </span>

                        </td>

                    </tr>


                    <tr>

                        <td class="text-muted">
                            Status
                        </td>

                        <td>

                            <span
                                class="type-badge ${
                                    active
                                        ? "badge-income"
                                        : "badge-expense"
                                }"
                            >
                                ${
                                    active
                                        ? "Active"
                                        : "Inactive"
                                }
                            </span>

                        </td>

                    </tr>


                    <tr>

                        <td class="text-muted">
                            Joined
                        </td>

                        <td>
                            ${formatDate(
                                u.created_at
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td class="text-muted">
                            Total Records
                        </td>

                        <td>
                            <strong>
                                ${totalRecords}
                            </strong>
                        </td>

                    </tr>


                </table>

            </div>

        `;


        // ----------------------------------------------------
        // MODAL ACTIONS
        // ----------------------------------------------------

        footer.innerHTML = `

            <button
                class="btn btn-warning btn-sm"
                onclick="
                    toggleUser(
                        ${safeNumber(u.id)},
                        '${escapeJs(u.name || "")}',
                        ${active}
                    );
                    bootstrap.Modal
                        .getInstance(
                            document.getElementById('userModal')
                        )
                        .hide();
                "
            >

                <i
                    class="bi bi-${
                        active
                            ? "pause"
                            : "play"
                    }-circle me-1"
                ></i>

                ${
                    active
                        ? "Deactivate"
                        : "Activate"
                }

            </button>


            <button
                class="btn btn-danger btn-sm"
                onclick="
                    deleteUser(
                        ${safeNumber(u.id)},
                        '${escapeJs(u.name || "")}'
                    );
                    bootstrap.Modal
                        .getInstance(
                            document.getElementById('userModal')
                        )
                        .hide();
                "
            >

                <i
                    class="bi bi-trash me-1"
                ></i>

                Delete

            </button>

        `;


    } catch (error) {

        console.error(
            "viewUser failed:",
            error
        );


        body.innerHTML = `

            <div class="text-danger text-center py-4">

                Unable to load user details.

            </div>

        `;

    }

}


/* ============================================================
   TOGGLE USER STATUS
============================================================ */

async function toggleUser(
    id,
    name,
    currentStatus
) {

    const action =
        currentStatus
            ? "deactivate"
            : "activate";


    const confirmed =
        confirm(
            `${action.charAt(0).toUpperCase() + action.slice(1)} user "${name}"?`
        );


    if (!confirmed) {
        return;
    }


    try {

        const res =
            await API.put(
                `/api/admin/users/${id}/deactivate`
            );


        if (res?.status === "success") {

            showToast(
                res.message ||
                `User ${action}d successfully.`
            );


            await Promise.all([
                loadUsers(currentPage),
                loadStats()
            ]);

        } else {

            showToast(
                res?.error ||
                "Action failed.",
                "danger"
            );

        }


    } catch (error) {

        console.error(
            "toggleUser failed:",
            error
        );


        showToast(
            "Unable to update user status.",
            "danger"
        );

    }

}


/* ============================================================
   DELETE USER
============================================================ */

async function deleteUser(
    id,
    name
) {

    const confirmed =
        confirm(
            `Permanently delete user "${name}" and ALL their data?\n\nThis CANNOT be undone.`
        );


    if (!confirmed) {
        return;
    }


    try {

        const res =
            await API.delete(
                `/api/admin/users/${id}`
            );


        if (res?.status === "success") {

            showToast(
                `User "${name}" deleted.`,
                "warning"
            );


            // If last item of current page was deleted,
            // move back one page when needed.
            const rowCount =
                document.querySelectorAll(
                    "#usersTable tbody tr"
                ).length;


            if (
                rowCount === 1 &&
                currentPage > 1
            ) {

                currentPage--;

            }


            await Promise.all([
                loadUsers(currentPage),
                loadStats()
            ]);


        } else {

            showToast(
                res?.error ||
                "Delete failed.",
                "danger"
            );

        }


    } catch (error) {

        console.error(
            "deleteUser failed:",
            error
        );


        showToast(
            "Unable to delete user.",
            "danger"
        );

    }

}


/* ============================================================
   PAGINATION
============================================================ */

function changePage(
    direction
) {

    const newPage =
        currentPage +
        direction;


    if (
        newPage >= 1 &&
        newPage <= totalPages
    ) {

        loadUsers(
            newPage
        );

    }

}


/* ============================================================
   SEARCH
============================================================ */

function debounceSearch() {

    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            function () {

                currentPage = 1;

                loadUsers(
                    1
                );

            },
            400
        );

}

</script>

</body>

</html>
