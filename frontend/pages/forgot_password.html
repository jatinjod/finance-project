<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password — FinanceAI</title>


<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>

</head>


<body>

<div class="auth-wrapper">

    <div class="auth-card">


        <div class="auth-logo">

            <div class="icon">
                🔐
            </div>

            <h4>
                Reset Password
            </h4>

            <p class="text-muted small mb-0">
                Enter your email to receive a reset link
            </p>

        </div>


        <div
            id="alertBox"
            aria-live="polite"
        ></div>


        <form id="forgotForm">


            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                id="submitBtn"
                class="btn btn-primary w-100 py-2"
            >

                <span id="btnText">
                    Send Reset Link
                </span>


                <span
                    id="spinner"
                    class="spinner-border spinner-border-sm ms-2 d-none"
                ></span>

            </button>


        </form>


        <div class="text-center mt-3">

            <a
                href="login.html"
                class="small text-decoration-none"
            >
                ← Back to Login
            </a>

        </div>


    </div>

</div>


<script src="../js/api.js"></script>


<script>

document.getElementById(
    "forgotForm"
).addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const emailInput =
            document.getElementById(
                "email"
            );


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const alertBox =
            document.getElementById(
                "alertBox"
            );


        const submitBtn =
            document.getElementById(
                "submitBtn"
            );


        const btnText =
            document.getElementById(
                "btnText"
            );


        const spinner =
            document.getElementById(
                "spinner"
            );


        alertBox.innerHTML =
            "";


        if (!email) {

            alertBox.innerHTML = `
                <div class="alert alert-warning">
                    Email is required.
                </div>
            `;

            return;
        }


        submitBtn.disabled =
            true;


        btnText.textContent =
            "Sending...";


        spinner.classList.remove(
            "d-none"
        );


        try {

            const response =
                await API.post(
                    "/api/auth/forgot-password",
                    {
                        email: email
                    }
                );


            if (
                response &&
                response.status === "success"
            ) {

                alertBox.innerHTML = `
                    <div class="alert alert-success">
                        ${escapeHtml(
                            response.message
                        )}
                    </div>

                    <div class="small text-muted mt-2">
                        Check your email inbox and spam folder.
                    </div>
                `;

            } else {

                alertBox.innerHTML = `
                    <div class="alert alert-danger">
                        ${
                            escapeHtml(
                                response?.error ||
                                "Unable to process your request."
                            )
                        }
                    </div>
                `;

            }


        } catch (error) {

            console.error(
                "Forgot password error:",
                error
            );


            alertBox.innerHTML = `
                <div class="alert alert-danger">
                    Unable to connect to the server.
                </div>
            `;


        } finally {

            submitBtn.disabled =
                false;


            btnText.textContent =
                "Send Reset Link";


            spinner.classList.add(
                "d-none"
            );

        }

    }
);


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>
</html>
