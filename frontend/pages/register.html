<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — FinanceAI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">💰</div>
      <h4>Create Account</h4>
      <p class="text-muted small mb-0">Start managing your finances today</p>
    </div>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control"
               placeholder="Full Name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control"
               placeholder="Email Address" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control"
               placeholder="Minimum 6 characters" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirmPwd" class="form-control"
               placeholder="Repeat your password" required>
      </div>
      <button type="submit" id="regBtn" class="btn btn-primary w-100 py-2 mt-1">
        <span id="btnText">Create Account</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">
        Already have an account? <a href="login.html" class="fw-500">Sign in</a>
      </small>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();

    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const pass    = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPwd').value;

    if (pass !== confirm) {
        showAlert('alertBox', 'Passwords do not match.', 'warning');
        return;
    }

    document.getElementById('btnText').textContent = 'Creating...';
    document.getElementById('btnSpinner').classList.remove('d-none');
    document.getElementById('regBtn').disabled = true;

    const res = await API.post('/api/auth/register', { name, email, password: pass });

    document.getElementById('btnText').textContent = 'Create Account';
    document.getElementById('btnSpinner').classList.add('d-none');
    document.getElementById('regBtn').disabled = false;

    if (res?.status === 'success') {
        showAlert('alertBox', 'Account created! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1800);
    } else {
        showAlert('alertBox', res?.error || 'Registration failed. Please try again.');
    }
});
</script>
</body>
</html>
