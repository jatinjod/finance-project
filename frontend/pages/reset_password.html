<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="referrer"
    content="no-referrer"
>

<title>Reset Password — FinanceAI</title>


<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>

</head>


<body>

<div class="auth-wrapper">

    <div class="auth-card">


        <div class="auth-logo">

            <div class="icon">
                🔑
            </div>

            <h4>
                Create New Password
            </h4>

            <p class="text-muted small mb-0">
                Choose a new password for your account
            </p>

        </div>


        <div
            id="alertBox"
            aria-live="polite"
        ></div>


        <form id="resetForm">


            <div class="mb-3">

                <label
                    for="newPassword"
                    class="form-label"
                >
                    New Password
                </label>


                <input
                    type="password"
                    id="newPassword"
                    class="form-control"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <div class="mb-3">

                <label
                    for="confirmPassword"
                    class="form-label"
                >
                    Confirm New Password
                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Re-enter password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                id="submitBtn"
                class="btn btn-primary w-100 py-2"
            >

                <span id="btnText">
                    Reset Password
                </span>


                <span
                    id="spinner"
                    class="spinner-border spinner-border-sm ms-2 d-none"
                ></span>

            </button>


        </form>


        <div class="text-center mt-3">

            <a
                href="login.html"
                class="small text-decoration-none"
            >
                ← Back to Login
            </a>

        </div>


    </div>

</div>


<script src="../js/api.js"></script>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const token =
    params.get(
        "token"
    );


const form =
    document.getElementById(
        "resetForm"
    );


const alertBox =
    document.getElementById(
        "alertBox"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


const btnText =
    document.getElementById(
        "btnText"
    );


const spinner =
    document.getElementById(
        "spinner"
    );


if (!token) {

    form.style.display =
        "none";


    alertBox.innerHTML = `
        <div class="alert alert-danger">
            This password reset link is invalid.
        </div>
    `;

}


form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const newPassword =
            document.getElementById(
                "newPassword"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        alertBox.innerHTML =
            "";


        if (!token) {

            return;
        }


        if (
            newPassword.length <
            6
        ) {

            showAlert(
                "Password must be at least 6 characters.",
                "warning"
            );

            return;
        }


        if (
            newPassword !==
            confirmPassword
        ) {

            showAlert(
                "Passwords do not match.",
                "warning"
            );

            return;
        }


        submitBtn.disabled =
            true;


        btnText.textContent =
            "Resetting...";


        spinner.classList.remove(
            "d-none"
        );


        try {

            const response =
                await API.post(
                    "/api/auth/reset-password",
                    {
                        token:
                            token,

                        new_password:
                            newPassword,

                        confirm_password:
                            confirmPassword
                    }
                );


            if (
                response &&
                response.status === "success"
            ) {

                alertBox.innerHTML = `
                    <div class="alert alert-success">
                        Password reset successful.
                        Please login with your new password.
                    </div>

                    <a
                        href="login.html"
                        class="btn btn-primary w-100 mt-2"
                    >
                        Go to Login
                    </a>
                `;


                form.style.display =
                    "none";


            } else {

                showAlert(
                    response?.error ||
                    "Password reset failed.",
                    "danger"
                );

            }


        } catch (error) {

            console.error(
                "Reset password error:",
                error
            );


            showAlert(
                "Unable to connect to the server.",
                "danger"
            );


        } finally {

            submitBtn.disabled =
                false;


            btnText.textContent =
                "Reset Password";


            spinner.classList.add(
                "d-none"
            );

        }

    }
);


function showAlert(
    message,
    type
) {

    alertBox.innerHTML = `
        <div class="alert alert-${type}">
            ${escapeHtml(message)}
        </div>
    `;

}


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>
</html>
