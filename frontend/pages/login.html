<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login — FinanceAI</title>


<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>

</head>


<body>


<div class="auth-wrapper">

    <div class="auth-card">


        <!-- LOGO -->

        <div class="auth-logo">

            <div class="icon">
                💰
            </div>

            <h4>
                FinanceAI
            </h4>

            <p class="text-muted small mb-0">
                Sign in to manage your finances
            </p>

        </div>


        <!-- ALERT -->

        <div
            id="alertBox"
            aria-live="polite"
            aria-atomic="true"
        ></div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            novalidate
        >

            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

<!-- PASSWORD -->
<div class="mb-3">
    <label
        for="password"
        class="form-label"
    >
        Password
    </label>

    <div class="input-group">
        <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            class="btn btn-outline-secondary"
            id="togglePassword"
            aria-label="Show password"
            title="Show password"
        >
            <i class="bi bi-eye"></i>
        </button>
    </div>
</div>


            <!-- FORGOT PASSWORD -->

            <div class="text-end mb-3">

                <a
                    href="forgot_password.html"
                    class="small text-decoration-none"
                >
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                id="loginBtn"
                class="btn btn-primary w-100 py-2"
            >

                <span id="btnText">
                    Sign In
                </span>


                <span
                    id="btnSpinner"
                    class="spinner-border spinner-border-sm ms-2 d-none"
                    aria-hidden="true"
                ></span>

            </button>


        </form>


        <!-- REGISTER -->

        <div class="text-center mt-3">

            <small class="text-muted">

                Don't have an account?

                <a
                    href="register.html"
                    class="fw-500"
                >
                    Register here
                </a>

            </small>

        </div>


        <hr class="my-3">


        <!-- TEST CREDENTIALS -->

        <div class="text-center">

            <small class="text-muted d-block mb-1">
                Test credentials:
            </small>


            <small class="text-muted">
                User: john@example.com / password123
            </small>


            <br>


            <small class="text-muted">
                Admin: admin@finance.com / admin123
            </small>

        </div>


    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>


<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        const btnText =
            document.getElementById(
                "btnText"
            );


        const btnSpinner =
            document.getElementById(
                "btnSpinner"
            );


        const alertBox =
            document.getElementById(
                "alertBox"
            );

        const togglePassword =
    document.getElementById("togglePassword");

if (togglePassword) {
    togglePassword.addEventListener(
        "click",
        function () {

            const passwordInput =
                document.getElementById("password");

            const icon =
                togglePassword.querySelector("i");

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type = "text";

                icon.className =
                    "bi bi-eye-slash";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

                togglePassword.setAttribute(
                    "title",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                icon.className =
                    "bi bi-eye";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

                togglePassword.setAttribute(
                    "title",
                    "Show password"
                );
            }
        }
    );
}    


        // Already logged in
        const existingToken =
            localStorage.getItem(
                "access_token"
            );


        if (existingToken) {

            window.location.href =
                "dashboard.html";

            return;
        }


        function displayAlert(
            message,
            type = "danger"
        ) {

            alertBox.innerHTML = "";


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                `alert alert-${type} alert-dismissible fade show`;


            wrapper.setAttribute(
                "role",
                "alert"
            );


            const messageText =
                document.createElement(
                    "span"
                );


            messageText.textContent =
                message;


            wrapper.appendChild(
                messageText
            );


            const closeButton =
                document.createElement(
                    "button"
                );


            closeButton.type =
                "button";


            closeButton.className =
                "btn-close";


            closeButton.setAttribute(
                "data-bs-dismiss",
                "alert"
            );


            closeButton.setAttribute(
                "aria-label",
                "Close"
            );


            wrapper.appendChild(
                closeButton
            );


            alertBox.appendChild(
                wrapper
            );

        }


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                alertBox.innerHTML =
                    "";


                if (!email) {

                    displayAlert(
                        "Email is required.",
                        "warning"
                    );

                    emailInput.focus();

                    return;
                }


                if (!password) {

                    displayAlert(
                        "Password is required.",
                        "warning"
                    );

                    passwordInput.focus();

                    return;
                }


                const emailPattern =
                    /^[\w.\-]+@[\w.\-]+\.\w+$/;


                if (
                    !emailPattern.test(
                        email
                    )
                ) {

                    displayAlert(
                        "Invalid email format.",
                        "danger"
                    );

                    emailInput.focus();

                    return;
                }


                loginBtn.disabled =
                    true;


                btnText.textContent =
                    "Signing in...";


                btnSpinner.classList.remove(
                    "d-none"
                );


                try {

                    const response =
                        await API.post(
                            "/api/auth/login",
                            {
                                email: email,
                                password: password
                            }
                        );


                    if (
                        response &&
                        response.status === "success" &&
                        response.data &&
                        response.data.access_token
                    ) {

                        localStorage.setItem(
                            "access_token",
                            response.data.access_token
                        );


                        localStorage.setItem(
                            "user",
                            JSON.stringify(
                                response.data.user || {}
                            )
                        );


                        displayAlert(
                            "Login successful. Redirecting...",
                            "success"
                        );


                        setTimeout(
                            function () {

                                window.location.href =
                                    "dashboard.html";

                            },
                            500
                        );


                        return;
                    }


                    displayAlert(
                        response?.error ||
                        response?.message ||
                        "Login failed. Please try again.",
                        "danger"
                    );


                } catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );


                    displayAlert(
                        "Unable to connect to the server. Please make sure the backend is running.",
                        "danger"
                    );


                } finally {

                    loginBtn.disabled =
                        false;


                    btnText.textContent =
                        "Sign In";


                    btnSpinner.classList.add(
                        "d-none"
                    );

                }

            }
        );

    }
);

</script>


</body>
</html>
